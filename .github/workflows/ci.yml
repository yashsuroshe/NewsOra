name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Server: Typecheck + Tests ───────────────────────────────────────────────
  server-ci:
    name: Server — Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-minimum-32-characters-long!!
          JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars!!
          GROQ_API_KEY: test-groq-key
          GEMINI_API_KEY: test-gemini-key
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/newsora-test
          CORS_ORIGINS: http://localhost:5173
          PORT: "4000"

  # ─── Client: Typecheck + Build ───────────────────────────────────────────────
  client-ci:
    name: Client — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000/api/v1
